<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ys 8 Aura Grass Calculator</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #1e1e24; 
            color: #f5f5f5; 
            padding: 20px; 
        }
        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            background: #2b2b36; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        h2 { 
            text-align: center; 
            color: #4CAF50; 
            margin-top: 0;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border-radius: 4px; 
            border: 1px solid #444; 
            background: #1e1e24; 
            color: white; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        button { 
            width: 100%; 
            margin-top: 25px; 
            padding: 12px; 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
        }
        button:hover { 
            background-color: #45a049; 
        }
        #result { 
            margin-top: 25px; 
            text-align: center; 
            font-size: 1.4em; 
            font-weight: bold; 
            color: #ffeb3b; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aura Grass Calculator</h2>
        
        <label for="currentGrass">Aura Grass (Already Owned):</label>
        <input type="number" id="currentGrass" min="0" value="0">
        
        <label for="saurianCarapaces">Saurian Carapaces:</label>
        <input type="number" id="saurianCarapaces" min="0" value="0">

        <label for="saurianFangs">Saurian Fangs:</label>
        <input type="number" id="saurianFangs" min="0" value="0">
        
        <label for="starryShells">Starry Shells:</label>
        <input type="number" id="starryShells" min="0" value="0">
        
        <button onclick="calculateGrass()">Calculate Total</button>
        
        <div id="result"></div>
    </div>

    <script>
        function calculateGrass() {
            // Grab the numbers from the inputs (default to 0 if they leave it blank)
            let currentGrass = parseInt(document.getElementById('currentGrass').value) || 0;
            let carapaces = parseInt(document.getElementById('saurianCarapaces').value) || 0;
            let fangs = parseInt(document.getElementById('saurianFangs').value) || 0;
            let shells = parseInt(document.getElementById('starryShells').value) || 0;

            // --- SAURIAN CONVERSIONS ---
            // Carapaces to Fangs
            let totalFangs = fangs + (carapaces * 4);
            // Fangs to Scales
            let totalScales = totalFangs * 5;
            // Scales to Tectite Ore
            let totalTectite = totalScales * 6;
            // Tectite Ore to Essence Stones (rounding down any leftover ore)
            let essenceFromSaurian = Math.floor(totalTectite / 10);

            // --- STARRY SHELL CONVERSIONS ---
            let bones = shells * 2;
            let hides = shells * 2;
            let essenceFromShells = shells * 1;

            // Combine all the Essence Stones we got
            let totalEssenceStones = essenceFromSaurian + essenceFromShells;

            // --- AURA GRASS CONVERSIONS ---
            // Divide by 30 and round that shit down so leftovers don't mess up the total
            let grassFromBones = Math.floor(bones / 30);
            let grassFromHides = Math.floor(hides / 30);
            let grassFromStones = Math.floor(totalEssenceStones / 30);

            // Add it all up
            let finalGrass = currentGrass + grassFromBones + grassFromHides + grassFromStones;

            // Spit out the answer
            document.getElementById('result').innerText = "Total Aura Grass: " + finalGrass;
        }
    </script>
</body>
</html>
